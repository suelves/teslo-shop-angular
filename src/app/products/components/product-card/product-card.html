
 <!-- <div class="mb-4 p-8 flex items-center justify-center"> -->
    <p-card class="full-height">
        <ng-template #header>
            <img alt="Card" class="w-full" [src]="product().images | productImage" [alt]="product().title" />
        </ng-template>
        <ng-template #title>
            <a [routerLink]="['/product', product().slug]">{{ product().title }}</a>
        </ng-template>
        <!-- <ng-template #subtitle> Card subtitle </ng-template> -->
        <p>
           {{ product().description | slice : 0 : 70 }}
        </p>
        <ng-template #footer>
            <div class="flex gap-4 mt-1">
                <p-button [routerLink]="['/product', product().slug]" label="Ver Producto" class="w-full" styleClass="w-full" />
            </div>
        </ng-template>
    </p-card>
